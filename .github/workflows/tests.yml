name: tests

on:
  push:
    branches: [ "2.x", "3.x" ]
  pull_request:
    branches: [ "2.x", "3.x" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        dependencies: [ "prefer-lowest", "prefer-stable" ]

    name: PHP ${{ matrix.php }} - ${{ matrix.dependencies }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Check dependencies for security advisories
        run: composer audit

      # The Integration suite needs Google credentials, so CI runs the Unit suite only.
      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit
